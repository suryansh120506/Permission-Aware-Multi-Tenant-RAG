<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  scene.html - interactive 3D map of the vector-store access filter.
  Rendered by app.py through st.iframe. The placeholder below is replaced with a
  JSON object built server-side from constants and API results only. Never put
  user-supplied text in it: the iframe shares an origin with the Streamlit app.
-->
<style>
  :root { --text:#f5f5f7; --muted:#86868b; --hair:rgba(255,255,255,.09); --red:#ff453a; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:transparent; overflow:hidden;
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", sans-serif; color:var(--text);
    -webkit-font-smoothing:antialiased; }
  .card {
    position:relative; width:100%; height:100%; border-radius:28px; overflow:hidden;
    background:
      radial-gradient(120% 90% at 50% 0%, #1d1d20 0%, #121214 55%, #0c0c0d 100%);
    border:1px solid var(--hair);
  }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; cursor:grab; touch-action:none; }
  canvas.drag { cursor:grabbing; }
  .cap { position:absolute; left:22px; top:18px; pointer-events:none; }
  .cap small { display:block; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:600; }
  .cap b { display:block; margin-top:4px; font-size:17px; font-weight:600; letter-spacing:-.01em; }
  .legend { position:absolute; left:22px; bottom:16px; display:flex; gap:14px; font-size:12px; color:var(--muted); pointer-events:none; }
  .legend i { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:0; }
  .hint { position:absolute; right:22px; bottom:16px; font-size:12px; color:#636366; pointer-events:none; }
  .tip {
    position:absolute; z-index:5; pointer-events:none; max-width:260px; opacity:0; transform:translateY(4px);
    transition:opacity .15s, transform .15s; padding:10px 12px; border-radius:14px; font-size:12px; line-height:1.45;
    background:rgba(40,40,44,.78); border:1px solid rgba(255,255,255,.12);
    -webkit-backdrop-filter:blur(16px) saturate(1.5); backdrop-filter:blur(16px) saturate(1.5);
    box-shadow:0 12px 32px rgba(0,0,0,.5);
  }
  .tip.on { opacity:1; transform:none; }
  .tip b { display:block; font-size:13px; margin-bottom:3px; }
  .tip code { font-family:ui-monospace, "SF Mono", "JetBrains Mono", Consolas, monospace; font-size:11px; color:#d1d1d6; }
  .fallback { position:absolute; inset:0; display:none; place-items:center; text-align:center; padding:24px; color:var(--muted); font-size:13px; line-height:1.6; }
</style>
</head>
<body>
<div class="card" id="card">
  <canvas id="c"></canvas>
  <div class="cap"><small>Vector store</small><b>Scoped before retrieval</b></div>
  <div class="legend">
    <span><i id="lgIn"></i>In your scope</span>
    <span><i style="background:#48484a"></i>Excluded by the filter</span>
  </div>
  <div class="hint">Drag to orbit · double-click to reset</div>
  <div class="tip" id="tip"></div>
  <div class="fallback" id="fb">The 3D view needs to load three.js from cdnjs.cloudflare.com.<br>Check your connection and refresh.</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" onerror="window.__noThree = true"></script>
<script>
(function () {
  const P = __PARAMS__;
  const card = document.getElementById("card");
  const canvas = document.getElementById("c");
  const tip = document.getElementById("tip");
  document.getElementById("lgIn").style.background = P.accent;

  if (window.__noThree || typeof THREE === "undefined") {
    canvas.style.display = "none";
    document.getElementById("fb").style.display = "grid";
    return;
  }

  const reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const RED = 0xff453a, GREEN = 0x30d158;
  const accent = new THREE.Color(P.accent);

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x000000, 0);
  if (THREE.sRGBEncoding) renderer.outputEncoding = THREE.sRGBEncoding;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 50);
  camera.position.set(0, 4.3, 7.6);
  camera.lookAt(0, 0.1, 0);

  scene.add(new THREE.AmbientLight(0xffffff, 0.62));
  const key = new THREE.DirectionalLight(0xffffff, 0.85); key.position.set(3, 7, 5); scene.add(key);
  const rim = new THREE.DirectionalLight(0x9aa4b8, 0.35); rim.position.set(-5, 3, -4); scene.add(rim);

  const root = new THREE.Group(); scene.add(root);

  // ---- geometry helpers --------------------------------------------------
  function roundedRect(w, h, r) {
    const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
    s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
    s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
    s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
    return s;
  }
  function slabGeometry(w, h, depth, r) {
    const g = new THREE.ExtrudeGeometry(roundedRect(w, h, r), {
      depth, bevelEnabled: true, bevelSize: 0.03, bevelThickness: 0.03, bevelSegments: 3, curveSegments: 10,
    });
    g.center();
    return g;
  }
  function labelTexture(tenant, role, inScope) {
    const c = document.createElement("canvas"); c.width = 640; c.height = 440;
    const g = c.getContext("2d");
    g.textBaseline = "alphabetic";
    g.fillStyle = inScope ? "rgba(255,255,255,.72)" : "rgba(255,255,255,.34)";
    g.font = "600 30px -apple-system, 'Segoe UI', Inter, sans-serif";
    g.fillText(tenant.toUpperCase(), 44, 96);
    g.fillStyle = inScope ? "#ffffff" : "rgba(255,255,255,.5)";
    g.font = "700 72px -apple-system, 'Segoe UI', Inter, sans-serif";
    g.fillText(role, 44, 184);
    g.font = "500 28px -apple-system, 'Segoe UI', Inter, sans-serif";
    g.fillStyle = inScope ? P.accent : "rgba(255,255,255,.32)";
    g.fillText(inScope ? "In scope" : "Locked", 44, 388);
    const t = new THREE.CanvasTexture(c);
    t.anisotropy = 4;
    if (THREE.sRGBEncoding) t.encoding = THREE.sRGBEncoding;
    return t;
  }

  // ---- slabs: one per (tenant, role) partition --------------------------
  const W = 2.9, H = 2.0, DEPTH = 0.14;
  const slabGeo = slabGeometry(W, H, DEPTH, 0.22);
  const docGeo = slabGeometry(0.92, 1.1, 0.05, 0.08);
  const slabs = [];
  const gapX = 1.72, gapZ = 1.32;

  P.tenants.forEach((tenant, ti) => {
    P.roles.forEach((role, ri) => {
      const inScope = tenant === P.active.tenant && role === P.active.role;
      const g = new THREE.Group();
      g.position.set((ri - 0.5) * 2 * gapX, 0, (ti - 0.5) * 2 * gapZ * -1);

      const body = new THREE.Mesh(slabGeo, new THREE.MeshStandardMaterial({
        color: inScope ? 0x2c2c30 : 0x1d1d20, roughness: 0.38, metalness: 0.55,
        emissive: inScope ? accent : new THREE.Color(0x000000), emissiveIntensity: inScope ? 0.16 : 0,
      }));
      body.rotation.x = -Math.PI / 2;
      g.add(body);

      const label = new THREE.Mesh(new THREE.PlaneGeometry(W - 0.3, (W - 0.3) * 440 / 640),
        new THREE.MeshBasicMaterial({ map: labelTexture(tenant, role, inScope), transparent: true, depthWrite: false }));
      label.rotation.x = -Math.PI / 2;
      label.position.set(-0.05, DEPTH / 2 + 0.045, 0.12);
      g.add(label);

      const doc = new THREE.Mesh(docGeo, new THREE.MeshStandardMaterial({
        color: inScope ? 0xf5f5f7 : 0x3a3a3e, roughness: 0.5, metalness: 0.1,
        emissive: inScope ? accent : new THREE.Color(0x000000), emissiveIntensity: inScope ? 0.35 : 0,
      }));
      doc.rotation.x = -Math.PI / 2;
      doc.position.set(0.82, DEPTH / 2 + 0.085, -0.28);
      doc.rotation.z = 0.12;
      g.add(doc);

      g.userData = { tenant, role, inScope, body, doc, lift: 0, base: g.position.y };
      body.userData.group = g;
      root.add(g);
      slabs.push(g);
    });
  });

  // Floating outline around the active slab: "your scope". Recolours on the result.
  const active = slabs.find(s => s.userData.inScope);
  const outlinePts = roundedRect(W + 0.36, H + 0.36, 0.3).getPoints(48).map(p => new THREE.Vector3(p.x, 0, -p.y));
  const outline = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(outlinePts),
    new THREE.LineBasicMaterial({ color: accent, transparent: true, opacity: 0.9 }));
  outline.position.set(active.position.x, 0.42, active.position.z);
  root.add(outline);
  const glow = new THREE.PointLight(accent, 1.4, 6); glow.position.set(active.position.x, 1.4, active.position.z); root.add(glow);

  // ---- result animation --------------------------------------------------
  let pulseT = -1, pulseKind = null;
  if (P.state === "granted" || P.state === "blocked") { pulseT = 0; pulseKind = P.state; }

  // ---- interaction -------------------------------------------------------
  let yaw = -0.32, pitch = 0.0, vYaw = 0, tYaw = yaw, tPitch = pitch, dragging = false, lx = 0, ly = 0;
  const pointer = new THREE.Vector2(9, 9), ray = new THREE.Raycaster();
  let hovered = null, parX = 0, parY = 0;

  canvas.addEventListener("pointerdown", e => { dragging = true; lx = e.clientX; ly = e.clientY; canvas.classList.add("drag"); canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener("pointerup", e => { dragging = false; canvas.classList.remove("drag"); try { canvas.releasePointerCapture(e.pointerId); } catch (_) {} });
  canvas.addEventListener("pointerleave", () => { pointer.set(9, 9); parX = parY = 0; });
  canvas.addEventListener("pointermove", e => {
    const r = canvas.getBoundingClientRect();
    pointer.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    if (dragging) {
      const dx = e.clientX - lx, dy = e.clientY - ly; lx = e.clientX; ly = e.clientY;
      tYaw += dx * 0.006; vYaw = dx * 0.006; tPitch = Math.max(-0.22, Math.min(0.3, tPitch + dy * 0.003));
    } else { parX = pointer.x; parY = pointer.y; }
    tip.style.left = Math.min(r.width - 270, e.clientX - r.left + 16) + "px";
    tip.style.top = Math.min(r.height - 90, e.clientY - r.top + 16) + "px";
  });
  canvas.addEventListener("dblclick", () => { tYaw = -0.32; tPitch = 0; });

  function setTip(g) {
    if (!g) { tip.classList.remove("on"); return; }
    const d = g.userData;
    tip.innerHTML = d.inScope
      ? `<b style="color:${P.accent}">In your scope</b><code>tenant_id="${d.tenant}" AND required_role="${d.role}"</code><br>Chunks here can be retrieved.`
      : `<b>Excluded by the filter</b><code>tenant_id="${d.tenant}" AND required_role="${d.role}"</code><br>Never a search candidate for ${P.active.name}.`;
    tip.classList.add("on");
  }

  // ---- loop --------------------------------------------------------------
  function resize() {
    const w = card.clientWidth, h = card.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.position.z = w < 520 ? 10.2 : 7.6;
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(card); resize();

  const clock = new THREE.Clock();
  function frame() {
    const t = clock.getElapsedTime(), dt = Math.min(clock.getDelta() || 0.016, 0.05);
    if (!dragging) { tYaw += vYaw; vYaw *= 0.92; }
    yaw += (tYaw + parX * 0.09 - yaw) * 0.08;
    pitch += (tPitch - parY * 0.05 - pitch) * 0.08;
    root.rotation.y = yaw; root.rotation.x = pitch;

    ray.setFromCamera(pointer, camera);
    const hit = ray.intersectObjects(slabs.map(s => s.userData.body), false)[0];
    const hg = hit ? hit.object.userData.group : null;
    if (hg !== hovered) { hovered = hg; setTip(hg); }

    slabs.forEach((g, i) => {
      const d = g.userData;
      const float = reduced ? 0 : Math.sin(t * 0.8 + i * 1.3) * 0.045;
      d.lift += (((g === hovered) ? 0.22 : 0) - d.lift) * 0.12;
      g.position.y = float + d.lift + (d.inScope ? 0.08 : 0);
      d.doc.rotation.z = 0.12 + (g === hovered ? Math.sin(t * 2.0) * 0.03 : 0);
    });

    outline.position.y = active.position.y + 0.42 + (reduced ? 0 : Math.sin(t * 1.2) * 0.03);
    outline.position.x = active.position.x; outline.position.z = active.position.z;
    glow.position.y = active.position.y + 1.4;

    if (pulseT >= 0) {
      pulseT += 0.016;
      const k = Math.min(pulseT / 1.4, 1), wave = Math.sin(k * Math.PI);
      const col = new THREE.Color(pulseKind === "granted" ? GREEN : RED);
      outline.material.color.copy(accent).lerp(col, wave);
      glow.color.copy(accent).lerp(col, wave);
      const s = 1 + wave * 0.05; outline.scale.set(s, 1, s);
      if (pulseKind === "blocked" && !reduced) outline.position.x += Math.sin(pulseT * 46) * 0.05 * (1 - k);
      // On a block, briefly flash every excluded slab to show nothing crossed the boundary.
      slabs.forEach(g => { if (!g.userData.inScope) g.userData.body.material.emissive.setHex(pulseKind === "blocked" ? RED : 0x000000),
        g.userData.body.material.emissiveIntensity = pulseKind === "blocked" ? wave * 0.45 : 0; });
      if (k >= 1) { pulseT = -1; outline.scale.set(1, 1, 1); outline.material.color.copy(accent); glow.color.copy(accent); }
    }

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
</body>
</html>
